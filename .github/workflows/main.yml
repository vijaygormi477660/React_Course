name: React CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "01.React Basic  Project/package-lock.json"

      - name: Install dependencies
        working-directory: "01.React Basic  Project"
        run: npm ci

      - name: Build React project
        working-directory: "01.React Basic  Project"
        run: npm run build
