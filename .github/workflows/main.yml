
name: React CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v5

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "01.React Basic  Project/package-lock.json"

      # Step 3: Install dependencies
      - name: Install dependencies
        working-directory: "01.React Basic  Project"
        run: npm ci

      # Step 4: Run test cases
      - name: Run test cases
        working-directory: "01.React Basic  Project"
        run: npm test

      # Step 5: Build React project
      - name: Build React project
        working-directory: "01.React Basic  Project"
        run: npm run build
